<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>reprolog</title>
<style>
:root{
  --bg:#f3f1ec;--panel:#fbfaf7;--card:#ffffff;--sunk:#ece9e2;--fg:#1d1f1c;--muted:#5f625b;--faint:#92948c;--line:#e2ded4;--line2:#d3cec2;
  --accent:#0d8a7a;--accent-ink:#ffffff;--accent-soft:#d9efe9;
  --err:#d4553a;--err-soft:#f9e1da;--warn:#b7791f;--warn-soft:#f6ebd3;--ok:#2f8f5b;--ok-soft:#ddf0e3;
  --m-get:#2f7ebd;--m-post:#0d8a7a;--m-put:#8a63c9;--m-patch:#b7791f;--m-delete:#d4553a;
  --k-request:#0d8a7a;--k-db:#8a63c9;--k-redis:#d4553a;--k-http:#2f7ebd;--k-llm:#b7791f;--k-internal:#7d8077;
  --mono:"SF Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121412;--panel:#181b19;--card:#1d211e;--sunk:#252a26;--fg:#e8eae4;--muted:#a3a89e;--faint:#737a70;--line:#2a2f2b;--line2:#353b36;
  --accent:#3cc7b0;--accent-ink:#0b1f1b;--accent-soft:#163631;
  --err:#ff7f62;--err-soft:#3a1f19;--warn:#e7b04f;--warn-soft:#352a16;--ok:#6fd398;--ok-soft:#173022;
  --m-get:#6cb3ee;--m-post:#3cc7b0;--m-put:#b69af0;--m-patch:#e7b04f;--m-delete:#ff7f62;
  --k-request:#3cc7b0;--k-db:#b69af0;--k-redis:#ff7f62;--k-http:#6cb3ee;--k-llm:#e7b04f;--k-internal:#9aa095;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:13.5px/1.5 var(--sans);background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--faint)}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 13px;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.solid:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.6;cursor:progress}

/* header */
header{display:flex;align-items:center;gap:16px;padding:12px 20px}
.brand{display:flex;align-items:baseline;gap:2px;font:800 17px var(--sans);letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.embedded .brand{display:none}
.brand small{font:500 11px var(--mono);color:var(--faint);margin-left:10px;letter-spacing:0}
.qbar{flex:1;max-width:760px;margin:0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:40px;padding:5px 8px 5px 12px;border:1.5px solid var(--line2);border-radius:var(--r);background:var(--card);cursor:text}
.qbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.qbar input{flex:1;min-width:180px;border:0;outline:0;background:transparent;font:13px var(--mono);padding:3px 0}
.tok{display:inline-flex;align-items:center;gap:6px;font:12px var(--mono);background:var(--accent-soft);color:var(--fg);border-radius:7px;padding:2px 4px 2px 9px}
.tok b{color:var(--accent);font-weight:600}
.tok button{border:0;background:transparent;color:var(--muted);padding:0 3px;font-size:14px;line-height:1}
.tok button:hover{color:var(--err)}
.qhint{font:11px var(--mono);color:var(--faint)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 11px;color:var(--muted);font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.live{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);font-size:12.5px}
.live .dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.live.on{color:var(--fg)}
.live.on .dot{background:var(--accent);animation:beat 1.8s infinite}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.55}}
.qerr{font:12px var(--mono);color:var(--err);text-align:center;margin:-4px 0 6px}
@media (prefers-reduced-motion:reduce){.live.on .dot{animation:none}.item.new{animation:none!important}}

/* stats strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(120px,170px)) minmax(0,1fr);gap:10px;padding:2px 20px 12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.tile .l{font-size:11.5px;color:var(--muted)}
.tile .v{font:700 20px var(--sans);letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font:500 12px var(--sans);color:var(--faint);margin-left:4px}
.tile .v.bad{color:var(--err)}
.tile .v.path{font:600 13px var(--mono);margin-top:7px}
.pulse{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 8px;display:flex;flex-direction:column;min-width:0}
.pulse .l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.pulse .l button{border:0;background:transparent;color:var(--accent);font-size:11.5px;padding:0}
.beats{flex:1;display:flex;align-items:flex-end;gap:3px;margin-top:6px;min-height:34px}
.beat{flex:1;min-width:0;border:0;padding:0;background:transparent;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
.beat i{display:block;border-radius:3px;background:color-mix(in srgb,var(--accent) 70%,transparent)}
.beat i.e{background:var(--err)}
.beat.zero i{background:var(--line2);height:3px!important}
.beat:hover i:not(.e){background:var(--accent)}
.beat.sel{outline:1.5px solid var(--accent);outline-offset:2px;border-radius:3px}
.pulse .ax{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--faint);margin-top:4px}

/* body */
.body{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;padding:0 20px 16px;min-height:0}
.body.open{grid-template-columns:250px minmax(0,1fr) minmax(420px,46%)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}

/* breakdown rail */
.rail{padding:12px 12px 14px;overflow:auto}
.rail h2{font:700 12px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 2px 10px}
.rail .seg{width:100%;margin-bottom:10px}
.rail .seg button{flex:1}
.meter{display:block;width:100%;border:0;background:transparent;text-align:left;padding:6px 6px 7px;border-radius:8px;position:relative}
.meter:hover{background:var(--sunk)}
.meter.on{background:var(--accent-soft)}
.meter .row1{display:flex;gap:8px;justify-content:space-between;font:12px var(--mono)}
.meter .row1 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .row1 span:last-child{color:var(--muted);flex:none}
.meter .track{height:5px;border-radius:3px;background:var(--sunk);margin-top:5px;overflow:hidden}
.meter .track i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.meter .track i.e{background:var(--err)}
.rail .tip{font-size:11.5px;color:var(--faint);margin:12px 4px 0;line-height:1.5}
.rail .tip code{font-family:var(--mono);background:var(--sunk);padding:0 4px;border-radius:4px;color:var(--fg)}

/* feed */
.feedhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.feedhead strong{font-size:13.5px}
.feedhead .count{font:12px var(--mono);color:var(--faint)}
.feedhead .sp{flex:1}
.feedhead label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.feed{overflow:auto;flex:1;padding:6px}
.group{font:600 11.5px var(--sans);color:var(--faint);padding:10px 10px 4px;text-transform:uppercase;letter-spacing:.07em}
.item{display:grid;grid-template-columns:44px 58px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-radius:9px;padding:8px 10px;background:transparent;text-align:left;position:relative}
.item::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:transparent}
.item.bad::before{background:var(--err)}
.item:hover{background:var(--card)}
.item.sel{background:var(--card);box-shadow:0 0 0 1.5px var(--accent) inset}
.item.new{animation:arrive 1.4s ease-out}
@keyframes arrive{from{background:var(--accent-soft)}to{background:transparent}}
.code{font:700 12px var(--mono);border-radius:6px;padding:3px 0;text-align:center}
.c2,.c3{background:var(--ok-soft);color:var(--ok)}.c4{background:var(--warn-soft);color:var(--warn)}.c5{background:var(--err-soft);color:var(--err)}.c0{background:var(--sunk);color:var(--muted)}
.meth{font:700 10.5px var(--mono);letter-spacing:.04em}
.m-GET{color:var(--m-get)}.m-POST{color:var(--m-post)}.m-PUT{color:var(--m-put)}.m-PATCH{color:var(--m-patch)}.m-DELETE{color:var(--m-delete)}
.what{min-width:0}
.what .p{font:12.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.what .p .qs{color:var(--faint)}
.what .s{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.what .s .e{color:var(--err);font-weight:600}
.what .s .rp{color:var(--accent);font-weight:600}
.when{text-align:right;min-width:74px}
.when .d{font:600 12px var(--mono)}
.when .d.slow{color:var(--warn)}
.when .t{font-size:11px;color:var(--faint)}
.empty{color:var(--faint);padding:46px 22px;text-align:center;line-height:1.7}
.empty code{font-family:var(--mono);background:var(--sunk);padding:1px 6px;border-radius:5px;color:var(--fg)}

/* drawer */
.drawer{overflow:auto;padding:16px 18px 40px;background:var(--card)}
.dh{display:flex;align-items:flex-start;gap:12px}
.dh .code{font-size:15px;padding:6px 10px;flex:none}
.dh .ttl{flex:1;min-width:0}
.dh .ttl .p{font:600 15px var(--mono);word-break:break-all}
.dh .ttl .p .qs{color:var(--faint);font-weight:400}
.dh .ttl .meta{font-size:12px;color:var(--faint);margin-top:2px}
.dh .x{border:0;background:transparent;color:var(--faint);padding:4px;border-radius:7px;display:inline-flex}
.dh .x:hover{color:var(--fg);background:var(--sunk)}
.story{margin:14px 0 4px;padding:11px 14px;border-radius:10px;background:var(--sunk);font-size:13px;line-height:1.55}
.story.bad{background:var(--err-soft)}
.story .e{color:var(--err);font-weight:600;font-family:var(--mono);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.opts{border:1px dashed var(--line2);border-radius:10px;padding:8px 12px;margin:10px 0}
.opts summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.opts textarea{width:100%;min-height:54px;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font:12px var(--mono);resize:vertical}
.opts label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:6px}
.verdict{border-radius:10px;padding:10px 14px;margin:10px 0;border:1px solid}
.verdict.repro{background:var(--err-soft);border-color:color-mix(in srgb,var(--err) 35%,transparent)}
.verdict.fixed{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.verdict.other{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.verdict strong{display:block;margin-bottom:2px}
.verdict .small{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin:16px 0 12px;background:var(--sunk);padding:3px;border-radius:10px;width:fit-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:transparent;border-radius:8px;padding:5px 12px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
h4{font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
pre{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:440px}
pre.err{color:var(--err)}
table.kv{border-collapse:collapse;width:100%;font:12px var(--mono)}
table.kv td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top;word-break:break-word}
table.kv tr:last-child td{border-bottom:0}
table.kv td:first-child{color:var(--muted);width:36%;word-break:break-all}
.cmd{display:flex;gap:6px;align-items:flex-start}.cmd pre{flex:1;min-width:0}

/* timeline */
.tl{position:relative;margin-left:6px;padding-left:22px;border-left:2px solid var(--line)}
.ev{position:relative;padding:3px 0 12px}
.ev::before{content:"";position:absolute;left:-29px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--k-internal)}
.ev.span::before{border-color:var(--accent)}
.ev.log::before{width:8px;height:8px;left:-27px;top:9px;border-width:0;background:var(--faint)}
.ev.log.warn::before{background:var(--warn)}.ev.log.err::before,.ev.error::before{background:var(--err);border-color:var(--err)}
.ev.out::before{border-color:var(--k-http);border-radius:3px}
.ev.out.llm::before{border-color:var(--k-llm)}
.ev.end::before{border-color:var(--faint);background:var(--faint);width:8px;height:8px;left:-27px;top:9px}
.ev .at{font:11px var(--mono);color:var(--faint)}
.ev .hd{font:12.5px var(--mono);word-break:break-word}
.ev .hd .k{font:700 10px var(--sans);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.ev.log.err .hd,.ev.error .hd{color:var(--err)}
.ev details summary{font-size:11.5px;color:var(--faint);cursor:pointer;margin-top:3px}
.ev details[open] summary{margin-bottom:5px}
.lv{font:700 10px var(--sans);letter-spacing:.06em;margin-right:6px}
.lv-ERROR,.lv-CRITICAL,.lv-FATAL{color:var(--err)}.lv-WARNING{color:var(--warn)}.lv-INFO,.lv-NOTICE{color:var(--accent)}.lv-DEBUG{color:var(--faint)}

/* waterfall */
.wf{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.wrow{display:grid;grid-template-columns:minmax(150px,42%) minmax(0,1fr) 60px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:5px 10px;min-height:30px}
.wrow:last-child{border-bottom:0}
.wrow:hover{background:var(--sunk)}
.wrow.sel{background:var(--accent-soft)}
.wrow .n{display:flex;align-items:center;gap:6px;min-width:0;padding-right:8px;font:12px var(--mono)}
.wrow .n span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow.error .n span.t{color:var(--err)}
.caret{width:12px;flex:none;color:var(--faint);font-size:10px;text-align:center}
.kd{flex:none;width:8px;height:8px;border-radius:2px}
.k-request{background:var(--k-request)}.k-db{background:var(--k-db)}.k-redis{background:var(--k-redis)}.k-http{background:var(--k-http)}.k-llm{background:var(--k-llm)}.k-internal{background:var(--k-internal)}
.lane{position:relative;height:12px}
.lane i{position:absolute;top:1px;height:10px;border-radius:5px;min-width:3px}
.lane b{position:absolute;top:-1px;width:2px;height:14px;background:var(--fg);opacity:.35;border-radius:1px}
.wrow .ms{font:11.5px var(--mono);color:var(--muted);text-align:right}
.spaninfo{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.spaninfo .nm{font:600 13px var(--mono);word-break:break-all}

@media (max-width:1280px){.body.open{grid-template-columns:minmax(0,1fr) minmax(400px,50%)}.body.open .railp{display:none}}
@media (max-width:980px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.pulse{grid-column:1 / -1}}
@media (max-width:860px){
  body{overflow:auto}header{flex-wrap:wrap}.qbar{order:3;max-width:none;width:100%}
  .body,.body.open{display:flex;flex-direction:column;overflow:visible;padding:0 12px 12px}.body.open .railp{display:flex}
  .strip{padding:2px 12px 12px}.feed{max-height:60vh}.item{grid-template-columns:40px minmax(0,1fr) auto}.item .meth{display:none}
}
</style>
</head>
<body>
<script>if(window.top!==window)document.documentElement.classList.add("embedded")</script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
</svg>

<header>
  <div class="brand">repro<i>log</i><small id="meta"></small></div>
  <div class="qbar" id="qbar">
    <svg class="i muted"><use href="#i-search"/></svg>
    <span id="toks" style="display:contents"></span>
    <input id="q" list="history" autocomplete="off" spellcheck="false" placeholder="Search, or filter: status >= 500 · path ~ cart · duration > 300" aria-label="Search and filter requests">
    <span class="qhint">/</span>
    <datalist id="history"></datalist>
  </div>
  <div class="seg" role="group" aria-label="Time range" id="range">
    <button data-r="900">15m</button><button data-r="3600">1h</button><button data-r="86400">24h</button><button data-r="0">All</button>
  </div>
  <button class="live" id="live" aria-pressed="true" title="Pause or resume the live feed"><span class="dot"></span><span id="live-text">Connecting…</span></button>
</header>
<div class="qerr" id="qerr" hidden></div>

<section class="strip" aria-label="Summary">
  <div class="tile"><div class="l">Requests</div><div class="v" id="s-req">–</div></div>
  <div class="tile"><div class="l">Failed</div><div class="v" id="s-fail">–</div></div>
  <div class="tile"><div class="l">Latency p50 / p95</div><div class="v" id="s-lat">–</div></div>
  <div class="tile"><div class="l">Slowest path</div><div class="v path" id="s-slow">–</div></div>
  <div class="pulse"><div class="l"><span id="p-label">Activity</span><button id="p-reset" hidden>Show all</button></div>
    <div class="beats" id="beats"></div><div class="ax" id="pax"></div></div>
</section>

<main class="body" id="body">
  <aside class="panel railp"><div class="rail">
    <h2>Breakdown</h2>
    <div class="seg" role="group" aria-label="Group by" id="by">
      <button data-by="path" aria-pressed="true">Paths</button><button data-by="status">Status</button><button data-by="method">Methods</button>
    </div>
    <div id="meters"></div>
    <div class="tip">Click a bar to filter. Type <code>field op value</code> in the search bar and press Enter to add a filter: <code>status</code> <code>method</code> <code>path</code> <code>duration</code> <code>error</code> <code>logs</code> <code>spans</code>, with <code>= != &gt; &lt; &gt;= &lt;= ~</code>.</div>
  </div></aside>

  <section class="panel">
    <div class="feedhead"><strong>Requests</strong><span class="count" id="count"></span><span class="sp"></span>
      <label><input type="checkbox" id="fails"> Failures only</label></div>
    <div class="feed" id="feed"></div>
  </section>

  <section class="panel" id="drawer" hidden><div class="drawer" id="dr"></div></section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = id => `<svg class="i"><use href="#${id}"/></svg>`;
const fmtMs = ms => ms == null ? "–" : ms < 1 ? ms.toFixed(2) + " ms" : ms < 100 ? ms.toFixed(1) + " ms" : ms < 1000 ? Math.round(ms) + " ms" : (ms / 1000).toFixed(2) + " s";
const clock = ts => new Date(ts * 1000).toLocaleTimeString([], {hour12:false});
const clockMs = ts => clock(ts) + "." + String(Math.floor((ts % 1) * 1000)).padStart(3, "0");
const ago = ts => { const s = Math.max(0, Date.now() / 1000 - ts); return s < 5 ? "just now" : s < 60 ? Math.floor(s) + "s ago" : s < 3600 ? Math.floor(s / 60) + "m ago" : s < 86400 ? Math.floor(s / 3600) + "h ago" : Math.floor(s / 86400) + "d ago"; };
const dayLabel = ts => { const d = new Date(ts * 1000), t = new Date(), y = new Date(Date.now() - 864e5);
  return d.toDateString() === t.toDateString() ? "Today" : d.toDateString() === y.toDateString() ? "Yesterday" : d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}); };
const cc = s => "c" + (s ? String(s)[0] : "0");
const failed = r => (r.status || 0) >= 500 || !!r.error_type;
const pct = (arr, p) => { if (!arr.length) return null; const a = [...arr].sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.floor(p * a.length))]; };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const S = {rows: [], maxSeq: 0, info: {}, text: "", clauses: [], fails: false, range: lsGet("reprolog.range", 0), slice: null,
  by: "path", live: true, pending: [], sel: null, cap: null, span: null, collapsed: new Set(), tab: "timeline", lastReplay: null,
  history: lsGet("reprolog.history", [])};

/* ---------- query: free text + `field op value` clauses ---------- */
const FIELDS = {method: r => r.method, path: r => r.path, status: r => r.status, duration: r => r.duration_ms,
  error: r => [r.error_type, r.error_message].filter(Boolean).join(" "), logs: r => r.log_count, spans: r => r.span_count, query: r => r.query};
const CLAUSE = /^(\w+)\s*(>=|<=|!=|=|>|<|~)\s*["']?(.+?)["']?$/;
function clauseTest(r, c) {
  const a = FIELDS[c.f](r), n = Number(c.v), num = c.v !== "" && !isNaN(n);
  switch (c.op) {
    case "~": return String(a ?? "").toLowerCase().includes(c.v.toLowerCase());
    case "=": return num ? Number(a) === n : String(a ?? "").toLowerCase() === c.v.toLowerCase();
    case "!=": return num ? Number(a) !== n : String(a ?? "").toLowerCase() !== c.v.toLowerCase();
    case ">": return Number(a) > n; case "<": return Number(a) < n; case ">=": return Number(a) >= n; case "<=": return Number(a) <= n;
  }
}
function addClause(str) {
  const m = str.trim().match(CLAUSE);
  if (!m) return false;
  const f = m[1].toLowerCase();
  if (!FIELDS[f]) { showErr(`Unknown field "${m[1]}". Try: ${Object.keys(FIELDS).join(", ")}`); return true; }
  const c = {f, op: m[2], v: m[3]}, key = `${c.f} ${c.op} ${c.v}`;
  if (!S.clauses.some(x => `${x.f} ${x.op} ${x.v}` === key)) S.clauses.push(c);
  S.history = [key, ...S.history.filter(h => h !== key)].slice(0, 15); lsSet("reprolog.history", S.history);
  showErr(""); return true;
}
function toggleClause(c) {
  const key = `${c.f} ${c.op} ${c.v}`, i = S.clauses.findIndex(x => `${x.f} ${x.op} ${x.v}` === key);
  i >= 0 ? S.clauses.splice(i, 1) : S.clauses.push(c);
  render();
}
function showErr(msg) { $("#qerr").textContent = msg; $("#qerr").hidden = !msg; }
function renderToks() {
  $("#toks").innerHTML = S.clauses.map((c, i) => `<span class="tok">${esc(c.f)} <b>${esc(c.op)}</b> ${esc(c.v)}<button data-rm="${i}" aria-label="Remove filter ${esc(c.f)} ${esc(c.op)} ${esc(c.v)}">×</button></span>`).join("");
  $("#toks").querySelectorAll("[data-rm]").forEach(b => b.onclick = ev => { ev.stopPropagation(); S.clauses.splice(+b.dataset.rm, 1); render(); });
  $("#history").innerHTML = S.history.map(h => `<option value="${esc(h)}">`).join("");
}
function pool() {  // rows in the chosen time range, before the pulse slice
  const now = Date.now() / 1000;
  return S.rows.filter(r => (!S.range || r.created_at >= now - S.range) && (!S.fails || failed(r)) && S.clauses.every(c => clauseTest(r, c)) &&
    (!S.text || `${r.method} ${r.path} ${r.query || ""} ${r.status} ${r.error_type || ""} ${r.error_message || ""}`.toLowerCase().includes(S.text)));
}
const shown = rows => S.slice ? rows.filter(r => r.created_at >= S.slice[0] && r.created_at < S.slice[1]) : rows;

/* ---------- summary + pulse ---------- */
function renderStrip(all) {
  const rows = shown(all), nf = rows.filter(failed).length, d = rows.map(r => r.duration_ms || 0);
  $("#s-req").innerHTML = rows.length ? `${rows.length}` : "0";
  $("#s-fail").innerHTML = rows.length ? `${nf}<small>${Math.round((nf / rows.length) * 100)}%</small>` : "0";
  $("#s-fail").classList.toggle("bad", nf > 0);
  $("#s-lat").innerHTML = rows.length ? `${fmtMs(pct(d, .5))}<small>/ ${fmtMs(pct(d, .95))}</small>` : "–";
  const slow = rows.reduce((m, r) => !m || (r.duration_ms || 0) > (m.duration_ms || 0) ? r : m, null);
  $("#s-slow").textContent = slow ? `${slow.path} · ${fmtMs(slow.duration_ms)}` : "–";
  $("#s-slow").title = slow ? slow.path : "";

  const now = Date.now() / 1000;
  let t0 = S.range ? now - S.range : Math.min(now - 300, ...all.map(r => r.created_at));
  const N = 48, w = (now - t0) / N, b = Array.from({length: N}, (_, i) => ({ok: 0, err: 0, s: t0 + i * w}));
  all.forEach(r => { const i = Math.min(N - 1, Math.max(0, Math.floor((r.created_at - t0) / w))); failed(r) ? b[i].err++ : b[i].ok++; });
  const max = Math.max(1, ...b.map(x => x.ok + x.err));
  $("#beats").innerHTML = b.map((x, i) => {
    const tot = x.ok + x.err, sel = S.slice && Math.abs(S.slice[0] - x.s) < 1e-6;
    const tip = `${clock(x.s)}–${clock(x.s + w)} · ${tot} request${tot === 1 ? "" : "s"}${x.err ? ` · ${x.err} failed` : ""}`;
    return `<button class="beat${tot ? "" : " zero"}${sel ? " sel" : ""}" data-i="${i}" title="${tip}" aria-label="${tip}">
      ${x.err ? `<i class="e" style="height:${(x.err / max) * 100}%"></i>` : ""}<i style="height:${(x.ok / max) * 100}%"></i></button>`;
  }).join("");
  $("#beats").querySelectorAll(".beat").forEach(el => el.onclick = () => {
    const x = b[+el.dataset.i]; S.slice = S.slice && Math.abs(S.slice[0] - x.s) < 1e-6 ? null : [x.s, x.s + w]; render(); });
  const fmtAx = ts => (now - t0) > 86400 ? new Date(ts * 1000).toLocaleDateString([], {month:"short", day:"numeric"}) : clock(ts).slice(0, 5);
  $("#pax").innerHTML = `<span>${fmtAx(t0)}</span><span>${fmtAx(t0 + (now - t0) / 2)}</span><span>now</span>`;
  $("#p-label").textContent = S.slice ? `Showing ${clock(S.slice[0])}–${clock(S.slice[1])}` : "Activity · click a bar to focus";
  $("#p-reset").hidden = !S.slice;
}

/* ---------- breakdown ---------- */
function renderMeters(rows) {
  const key = {path: r => r.path, status: r => r.status ? `${String(r.status)[0]}xx` : "none", method: r => r.method}[S.by];
  const m = new Map();
  rows.forEach(r => { const k = key(r); const e = m.get(k) || {n: 0, f: 0}; e.n++; if (failed(r)) e.f++; m.set(k, e); });
  const list = [...m.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 14), max = Math.max(1, ...list.map(x => x[1].n));
  const clauseFor = k => S.by === "status" ? (k === "none" ? null : {f: "status", op: "~", v: k[0]}) : {f: S.by, op: "=", v: k};
  const active = c => c && S.clauses.some(x => x.f === c.f && x.op === c.op && x.v === c.v);
  $("#meters").innerHTML = list.length ? list.map(([k, e], i) => {
    const c = clauseFor(k);
    return `<button class="meter${active(c) ? " on" : ""}" data-i="${i}" title="${esc(k)}"><div class="row1"><span>${esc(k)}</span><span>${e.n}${e.f ? ` · <span style="color:var(--err)">${e.f}✕</span>` : ""}</span></div>
      <div class="track"><i style="width:${(e.n / max) * 100}%"></i></div></button>`;
  }).join("") : '<div class="muted" style="padding:6px">Nothing yet.</div>';
  $("#meters").querySelectorAll(".meter").forEach(el => el.onclick = () => { const c = clauseFor(list[+el.dataset.i][0]); if (c) toggleClause(c); });
}

/* ---------- feed ---------- */
function itemHtml(r, isNew, slowCut) {
  const qs = r.query ? `<span class="qs">?${esc(r.query)}</span>` : "";
  const bits = [];
  if (r.replay_of) bits.push(`<span class="rp">replay of ${esc(r.replay_of)}</span>`);
  if (r.error_type) bits.push(`<span class="e">${esc(r.error_type)}</span>${r.error_message ? " " + esc(r.error_message.slice(0, 90)) : ""}`);
  bits.push(`${r.span_count || 0} span${r.span_count === 1 ? "" : "s"} · ${r.log_count || 0} log${r.log_count === 1 ? "" : "s"}`);
  return `<button class="item${failed(r) ? " bad" : ""}${r.id === S.sel ? " sel" : ""}${isNew ? " new" : ""}" data-id="${r.id}">
    <span class="code ${cc(r.status)}">${r.status ?? "–"}</span>
    <span class="meth m-${esc(r.method)}">${esc(r.method)}</span>
    <span class="what"><div class="p">${esc(r.path)}${qs}</div><div class="s">${bits.join(" · ")}</div></span>
    <span class="when"><div class="d${(r.duration_ms || 0) >= slowCut ? " slow" : ""}">${fmtMs(r.duration_ms)}</div><div class="t" title="${new Date(r.created_at * 1000).toLocaleString()}" data-ts="${r.created_at}">${ago(r.created_at)}</div></span></button>`;
}
function renderFeed(rows, newIds = new Set()) {
  $("#count").textContent = `${rows.length} shown`;
  if (!rows.length) {
    $("#feed").innerHTML = S.rows.length ? '<div class="empty">Nothing matches. Remove a filter or widen the time range.</div>' :
      `<div class="empty">Waiting for requests.<br>Start your app with <code>REPROLOG_ENABLED=1</code><br>and <code>REPROLOG_CAPTURE_ALL=1</code> to see every request.</div>`;
    return;
  }
  const slowCut = Math.max(500, pct(rows.map(r => r.duration_ms || 0), .9) || 0);
  let g = null, html = "";
  for (const r of rows) { const d = dayLabel(r.created_at); if (d !== g) { html += `<div class="group">${d}</div>`; g = d; } html += itemHtml(r, newIds.has(r.id), slowCut); }
  $("#feed").innerHTML = html;
  $("#feed").querySelectorAll(".item").forEach(el => el.onclick = () => open(el.dataset.id));
}
function render(newIds) {
  const all = pool(), rows = shown(all);
  renderToks(); renderStrip(all); renderMeters(rows); renderFeed(rows, newIds);
}

/* ---------- data ---------- */
async function load() {
  const [rows, info] = await Promise.all([fetch("/api/captures?limit=1000").then(r => r.json()), fetch("/api/info").then(r => r.json())]);
  S.info = info; S.rows = rows; S.maxSeq = rows.reduce((m, r) => Math.max(m, r.seq || 0), 0);
  $("#meta").textContent = `${(info.cwd || "").split("/").filter(Boolean).pop() || info.app}`;
  render(); connect();
}
function connect() {
  const es = new EventSource("/api/stream?after=" + S.maxSeq);
  es.onopen = setLive;
  es.onerror = () => { $("#live").classList.remove("on"); $("#live-text").textContent = "Reconnecting…"; };
  es.onmessage = ev => {
    const r = JSON.parse(ev.data);
    S.maxSeq = Math.max(S.maxSeq, r.seq || 0);
    if (!S.live) { S.pending.push(r); setLive(); return; }
    S.rows = [r, ...S.rows.filter(x => x.id !== r.id)].slice(0, 2000);
    render(new Set([r.id]));
  };
}
function setLive() {
  $("#live").classList.toggle("on", S.live); $("#live").setAttribute("aria-pressed", String(S.live));
  $("#live-text").textContent = S.live ? "Live" : S.pending.length ? `Paused · ${S.pending.length} waiting` : "Paused";
}

/* ---------- drawer ---------- */
async function open(id, keepReplay) {
  S.sel = id; if (!keepReplay) S.lastReplay = null;
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
  const cap = await fetch("/api/captures/" + id).then(r => r.json());
  $("#body").classList.add("open"); $("#drawer").hidden = false;
  if (cap.error && !cap.request) { $("#dr").innerHTML = `<div class="empty">${esc(cap.error)}</div>`; return; }
  S.cap = cap; S.span = (cap.spans || [])[0]?.id ?? null; S.collapsed = new Set();
  renderDrawer();
}
function close() { S.sel = null; S.cap = null; $("#body").classList.remove("open"); $("#drawer").hidden = true; document.querySelectorAll(".item.sel").forEach(e => e.classList.remove("sel")); }

function pretty(b) {
  if (!b || b.encoding === "empty") return "(empty)" + (b && b.note ? " · " + b.note : "");
  let d = b.data || "";
  if (b.encoding === "base64") return "(binary, " + d.length + " base64 chars)";
  try { d = JSON.stringify(JSON.parse(d), null, 2); } catch (e) {}
  return d + (b.note ? "\n\n(" + b.note + ")" : "");
}
function kv(obj) {
  const e = Array.isArray(obj) ? obj : Object.entries(obj || {});
  if (!e.length) return '<div class="muted">(none)</div>';
  return '<table class="kv">' + e.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</td></tr>`).join("") + "</table>";
}
function storyHtml(c) {
  const s = c.response.status, e = c.error, nl = (c.logs || []).length, no = (c.outbound || []).length, ns = (c.spans || []).length;
  const llm = (c.outbound || []).filter(o => o.kind === "llm").length;
  const parts = [`${ns} span${ns === 1 ? "" : "s"}`, `${nl} log line${nl === 1 ? "" : "s"}`, `${no} outbound call${no === 1 ? "" : "s"}${llm ? ` (${llm} to an LLM)` : ""}`];
  const head = e ? `Failed with <span class="e">${esc(e.type)}</span> after ${fmtMs(c.duration_ms)}` + (e.source === "logged" ? " (logged, then answered " + (s ?? "–") + ")" : "")
    : `Answered <b>${s ?? "–"}</b> in ${fmtMs(c.duration_ms)}`;
  return `<div class="story${e || (s || 0) >= 500 ? " bad" : ""}">${head}. Recorded ${parts.join(", ")}.${e && e.message ? `<div class="e" style="margin-top:4px;font-weight:400">${esc(e.message.slice(0, 220))}</div>` : ""}</div>`;
}
function timelineHtml(c) {
  const spans = c.spans || [], t0 = Math.min(c.created_at, ...spans.map(s => s.start)), ev = [];
  const root = spans[0];
  spans.forEach(s => { if (s !== root) ev.push({t: s.start, kind: "span", s}); });
  (c.logs || []).forEach(l => ev.push({t: l.time, kind: "log", l}));
  (c.outbound || []).forEach(o => ev.push({t: o.started_at || t0, kind: "out", o}));
  ev.sort((a, b) => a.t - b.t);
  const at = t => `+${fmtMs(Math.max(0, (t - t0) * 1000))}`;
  const q = c.request;
  let html = `<div class="ev span"><div class="at">${clockMs(t0)}</div><div class="hd"><span class="k" style="color:var(--accent)">start</span>${esc(q.method)} ${esc(q.path)}</div></div>`;
  for (const x of ev) {
    if (x.kind === "span") {
      const s = x.s;
      html += `<div class="ev span"><div class="at">${at(x.t)} · ${fmtMs((s.end - s.start) * 1000)}</div>
        <div class="hd"><span class="k" style="color:var(--k-${esc(s.kind)})">${esc(s.kind)}</span>${esc(s.name)}</div>
        ${Object.keys(s.attributes || {}).length ? `<details><summary>attributes</summary>${kv(s.attributes)}</details>` : ""}</div>`;
    } else if (x.kind === "log") {
      const l = x.l, lvl = /ERROR|CRITICAL|FATAL/.test(l.level) ? " err" : l.level === "WARNING" ? " warn" : "";
      html += `<div class="ev log${lvl}"><div class="at">${at(x.t)}${l.where ? " · " + esc(l.where) : ""}</div>
        <div class="hd"><span class="lv lv-${esc(l.level)}">${esc(l.level)}</span>${esc(l.message)}</div>
        ${l.fields ? `<details${Object.keys(l.fields).length <= 3 ? " open" : ""}><summary>fields</summary>${kv(l.fields)}</details>` : ""}
        ${l.traceback ? `<details><summary>traceback</summary><pre>${esc(l.traceback)}</pre></details>` : ""}</div>`;
    } else {
      const o = x.o;
      html += `<div class="ev out${o.kind === "llm" ? " llm" : ""}"><div class="at">${at(x.t)} · ${fmtMs(o.duration_ms)}</div>
        <div class="hd"><span class="k" style="color:var(--k-${o.kind === "llm" ? "llm" : "http"})">${o.kind === "llm" ? "llm call" : "http call"}</span>${esc(o.method)} ${esc(o.url)} → ${o.response.status ?? "error"}</div>
        ${o.usage ? `<details open><summary>token usage</summary>${kv(o.usage)}</details>` : ""}
        <details><summary>request &amp; response</summary><h4>Request body</h4><pre>${esc(pretty(o.request.body))}</pre><h4>Response body</h4><pre>${esc(pretty(o.response.body))}</pre></details></div>`;
    }
  }
  if (c.error) html += `<div class="ev error"><div class="at">exception</div><div class="hd">${esc(c.error.type)}: ${esc(c.error.message)}</div>
    <details><summary>traceback</summary><pre>${esc(c.error.traceback || "")}</pre></details></div>`;
  html += `<div class="ev end"><div class="at">+${fmtMs(c.duration_ms)}</div><div class="hd"><span class="k" style="color:var(--muted)">end</span>responded ${c.response.status ?? "–"}</div></div>`;
  return `<div class="tl">${html}</div>`;
}
function tree(spans) {
  const kids = {}, ids = new Set(spans.map(s => s.id)), out = [];
  spans.forEach(s => (kids[s.parent_id ?? "_"] ||= []).push(s));
  Object.values(kids).forEach(l => l.sort((a, b) => a.start - b.start));
  const walk = (s, d) => { out.push({s, d, kids: !!(kids[s.id] || []).length}); if (!S.collapsed.has(s.id)) (kids[s.id] || []).forEach(k => walk(k, d + 1)); };
  spans.filter(s => s.parent_id == null || !ids.has(s.parent_id)).forEach(r => walk(r, 0));
  return out;
}
function waterfallHtml(c) {
  const spans = c.spans || [];
  if (!spans.length) return '<div class="empty">No span data in this capture.</div>';
  const t0 = Math.min(...spans.map(s => s.start)), t1 = Math.max(t0 + 0.001, ...spans.map(s => s.end)), W = t1 - t0;
  const logsBy = {}; (c.logs || []).forEach(l => (logsBy[l.span_id] ||= []).push(l));
  const rows = tree(spans).map(({s, d, kids}) => {
    const left = ((s.start - t0) / W) * 100, width = Math.max(((s.end - s.start) / W) * 100, 0.5);
    const ticks = (logsBy[s.id] || []).map(l => `<b style="left:${(((l.time - t0) / W) * 100).toFixed(2)}%"></b>`).join("");
    return `<button class="wrow${s.status === "error" ? " error" : ""}${s.id === S.span ? " sel" : ""}" data-id="${esc(s.id)}">
      <span class="n" style="padding-left:${d * 13}px"><span class="caret" data-toggle="${esc(s.id)}">${kids ? (S.collapsed.has(s.id) ? "▸" : "▾") : ""}</span><span class="kd k-${esc(s.kind)}"></span><span class="t" title="${esc(s.name)}">${esc(s.name)}</span></span>
      <span class="lane"><i class="k-${esc(s.kind)}" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%"></i>${ticks}</span>
      <span class="ms">${fmtMs((s.end - s.start) * 1000)}</span></button>`;
  }).join("");
  const sp = spans.find(x => x.id === S.span);
  const logs = sp ? (c.logs || []).filter(l => l.span_id === sp.id) : [];
  const info = sp ? `<div class="spaninfo"><div class="nm">${esc(sp.name)}</div><div class="muted" style="font-size:12px">${esc(sp.kind)} · ${fmtMs((sp.end - sp.start) * 1000)} · ${sp.status} · ${logs.length} log line${logs.length === 1 ? "" : "s"}</div>
    ${logs.map(l => `<div style="margin-top:8px;font:12px var(--mono)"><span class="lv lv-${esc(l.level)}">${esc(l.level)}</span>${esc(l.message)}</div>`).join("")}
    <h4>Attributes</h4>${kv(sp.attributes)}</div>` : "";
  return `<div class="wf">${rows}</div>${info}`;
}
function verdictHtml() {
  const r = S.lastReplay;
  if (!r) return "";
  if (r.failed) return `<div class="verdict other"><strong>${esc(r.message)}</strong><details open><summary class="small">Output</summary><pre>${esc(r.output_tail || "")}</pre></details></div>`;
  const v = r.verdict, info = (r.replayed && r.replayed.replay) || {};
  const cls = v.reproduced ? "repro" : (v.replayed_status || 0) < 500 && !(r.replayed && r.replayed.error) ? "fixed" : "other";
  const misses = (info.unmatched_outbound || []).map(m => `<div class="mono small">not in recording, sent live: ${esc(m.method)} ${esc(m.url)}</div>`).join("");
  return `<div class="verdict ${cls}"><strong>${esc(v.summary)}</strong>
    <div class="small">Status ${v.original_status ?? "–"} → ${v.replayed_status ?? "–"} · outbound served from recording: ${info.mocked_outbound ?? 0} of ${info.recorded_outbound ?? 0} · took ${r.seconds}s</div>${misses}
    ${r.saved_id ? `<div style="margin-top:8px"><button class="btn" id="open-replay">Open the replay</button></div>` : ""}
    <details><summary class="small">Replay output</summary><pre>${esc(r.output_tail || "")}</pre></details></div>`;
}
function renderDrawer() {
  const c = S.cap, q = c.request, s = c.response, e = c.error;
  const redacted = (q.headers || []).filter(h => h[1] === "[REDACTED]").map(h => h[0]);
  const tabs = [["timeline", "Timeline"], ["spans", "Waterfall"], ["request", "Request"], ["response", "Response"], ["raw", "Raw JSON"]];
  let body = "";
  if (S.tab === "timeline") body = timelineHtml(c);
  if (S.tab === "spans") body = waterfallHtml(c);
  if (S.tab === "request") body = `<h4>Body${q.body && q.body.redacted ? " · secrets redacted" : ""}</h4><pre>${esc(pretty(q.body))}</pre><h4>Headers</h4>${kv(q.headers)}
    <h4>Replay from a terminal</h4><div class="cmd"><pre id="cli">reprolog replay ${esc(c.id)} --app ${esc(S.info.app)}</pre><button class="btn" data-copy="cli" aria-label="Copy command">${icon("i-copy")}</button></div>`;
  if (S.tab === "response") body = `<h4>Status</h4><div class="mono">${s.status ?? "–"}</div><h4>Body</h4><pre>${esc(pretty(s.body))}</pre><h4>Headers</h4>${kv(s.headers)}`;
  if (S.tab === "raw") { const {_curl, ...raw} = c; body = `<pre id="raw">${esc(JSON.stringify(raw, null, 2))}</pre>`; }
  $("#dr").innerHTML = `
    <div class="dh"><span class="code ${cc(s.status)}">${s.status ?? "–"}</span>
      <div class="ttl"><div class="p"><span class="meth m-${esc(q.method)}">${esc(q.method)}</span> ${esc(q.path)}${q.query_string ? `<span class="qs">?${esc(q.query_string)}</span>` : ""}</div>
        <div class="meta">${new Date(c.created_at * 1000).toLocaleString()} · ${ago(c.created_at)} · <span class="mono">${esc(c.id)}</span>${c.replay_of ? ` · replay of <a href="#" id="orig" class="mono">${esc(c.replay_of)}</a>` : ""}</div></div>
      <button class="x" id="dclose" title="Close (Esc)" aria-label="Close">${icon("i-x")}</button></div>
    ${storyHtml(c)}
    <div class="actions"><button class="btn solid" id="replay">${icon("i-replay")}<span>Replay locally</span></button>
      <button class="btn" data-copy="curl-src">${icon("i-copy")}<span>Copy as curl</span></button></div>
    <pre id="curl-src" hidden>${esc(c._curl)}</pre>
    <details class="opts"${redacted.length ? " open" : ""}><summary>Replay settings${redacted.length ? ` · ${redacted.length} header(s) were redacted (${esc(redacted.join(", "))}), add fresh values below` : ""}</summary>
      <textarea id="hdrs" placeholder="One header per line, e.g.&#10;Authorization: Bearer <fresh token>" aria-label="Header overrides">${esc(lsGet("reprolog.hdrs", ""))}</textarea>
      <label><input type="checkbox" id="live-out"> Call outside APIs for real (otherwise answered from the recording)</label>
      <div class="muted" style="font-size:11.5px;margin-top:4px">Database, Redis and email run for real during a replay.</div></details>
    <div id="verdict">${verdictHtml()}</div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}</button>`).join("")}</div>
    <div>${body}</div>`;
  $("#dclose").onclick = close;
  $("#replay").onclick = replay;
  $("#hdrs").oninput = ev => lsSet("reprolog.hdrs", ev.target.value);
  const o = $("#orig"); if (o) o.onclick = ev => { ev.preventDefault(); open(c.replay_of); };
  const r = $("#open-replay"); if (r) r.onclick = () => open(S.lastReplay.saved_id, true);
  $("#dr").querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderDrawer(); });
  $("#dr").querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy, b));
  $("#dr").querySelectorAll(".wrow").forEach(el => el.onclick = ev => {
    const t = ev.target.closest("[data-toggle]");
    if (t && t.textContent) { const id = t.dataset.toggle; S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id); }
    else S.span = el.dataset.id;
    renderDrawer();
  });
}
async function replay() {
  const btn = $("#replay"), label = btn.querySelector("span");
  const headers = ($("#hdrs").value || "").split("\n").map(x => x.trim()).filter(x => x.includes(":"));
  btn.disabled = true; label.textContent = "Replaying…";
  $("#verdict").innerHTML = '<div class="verdict other"><strong>Replaying…</strong><div class="small">Importing your app and re-running this request.</div></div>';
  try {
    const res = await fetch("/api/replay/" + S.cap.id, {method: "POST", headers: {"Content-Type": "application/json", "X-Reprolog": "1"},
      body: JSON.stringify({headers, live_outbound: $("#live-out").checked})});
    S.lastReplay = await res.json();
  } catch (e) { S.lastReplay = {failed: true, message: "Could not reach the viewer: " + e.message}; }
  btn.disabled = false; label.textContent = "Replay locally";
  $("#verdict").innerHTML = verdictHtml();
  const r = $("#open-replay"); if (r) r.onclick = () => open(S.lastReplay.saved_id, true);
}
async function copy(id, btn) {
  const node = document.getElementById(id), was = btn.innerHTML;
  try { await navigator.clipboard.writeText(node.textContent); btn.innerHTML = "Copied"; }
  catch (e) { node.hidden = false; const r = document.createRange(); r.selectNodeContents(node); getSelection().removeAllRanges(); getSelection().addRange(r); btn.innerHTML = "Selected below"; }
  setTimeout(() => btn.innerHTML = was, 1400);
}

/* ---------- wiring ---------- */
const qin = $("#q");
qin.oninput = () => { if (!CLAUSE.test(qin.value.trim())) { S.text = qin.value.trim().toLowerCase(); render(); } };
qin.onkeydown = ev => {
  if (ev.key === "Enter") { if (addClause(qin.value)) { qin.value = ""; S.text = ""; render(); } }
  else if (ev.key === "Backspace" && !qin.value && S.clauses.length) { S.clauses.pop(); render(); }
  else if (ev.key === "Escape") { qin.value = ""; S.text = ""; qin.blur(); render(); }
};
$("#qbar").onclick = () => qin.focus();
document.querySelectorAll("#range button").forEach(b => {
  b.setAttribute("aria-pressed", String(+b.dataset.r === S.range));
  b.onclick = () => { S.range = +b.dataset.r; S.slice = null; lsSet("reprolog.range", S.range);
    document.querySelectorAll("#range button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render(); };
});
document.querySelectorAll("#by button").forEach(b => b.onclick = () => { S.by = b.dataset.by;
  document.querySelectorAll("#by button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render(); });
$("#fails").onchange = ev => { S.fails = ev.target.checked; render(); };
$("#p-reset").onclick = () => { S.slice = null; render(); };
$("#live").onclick = () => {
  S.live = !S.live;
  if (S.live && S.pending.length) { const ids = new Set(S.pending.map(r => r.id));
    S.rows = [...S.pending.reverse(), ...S.rows.filter(x => !ids.has(x.id))].slice(0, 2000); S.pending = []; render(ids); }
  setLive();
};
document.addEventListener("keydown", ev => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (ev.key === "/" && !typing) { ev.preventDefault(); qin.focus(); }
  if (ev.key === "Escape" && S.cap && !typing) close();
});
setInterval(() => document.querySelectorAll("[data-ts]").forEach(el => el.textContent = ago(+el.dataset.ts)), 10000);
load();
</script>
</body>
</html>
