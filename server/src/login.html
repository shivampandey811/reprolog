<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in · reprolog</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--fg:#1d1f1c;--muted:#5f625b;--line:#e2ded4;--accent:#0d8a7a;--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121412;--card:#1d211e;--fg:#e8eae4;--muted:#a3a89e;--line:#2a2f2b;--accent:#3cc7b0;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font:15px/1.5 var(--sans);background:var(--bg);color:var(--fg)}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;text-align:center}
.brand{font:800 24px var(--sans);letter-spacing:-.02em;text-decoration:none;color:var(--fg)}
.brand i{font-style:normal;color:var(--accent)}
p{color:var(--muted);margin:8px 0 26px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border-radius:10px;text-decoration:none;font-weight:600;background:#1f2328;color:#fff}
.btn+.btn{margin-top:10px;background:none;color:var(--muted);border:1px solid var(--line)}
svg{width:20px;height:20px;fill:currentColor}
small{display:block;margin-top:20px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="card">
  <a class="brand" href="/">repro<i>log</i></a>
  <p>Log in to see your projects' activity.</p>
  <a class="btn" href="/auth/github"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>Continue with GitHub</a>
  <a class="btn" href="/auth/dev" id="dev" hidden>Local dev login</a>
  <small>We only read your name and email from GitHub.</small>
</div>
<script>if(["localhost","127.0.0.1"].includes(location.hostname))document.getElementById("dev").hidden=false</script>
</body>
</html>
