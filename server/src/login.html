<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · reprolog</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--fg:#1d1f1c;--muted:#5f625b;--line:#e2ded4;--accent:#0d8a7a;--accent-ink:#fff;--err:#d4553a;--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121412;--card:#1d211e;--fg:#e8eae4;--muted:#a3a89e;--line:#2a2f2b;--accent:#3cc7b0;--accent-ink:#0b1f1b;--err:#ff7f62;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font:15px/1.5 var(--sans);background:var(--bg);color:var(--fg)}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px}
.brand{display:block;text-align:center;font:800 24px var(--sans);letter-spacing:-.02em;text-decoration:none;color:var(--fg)}
.brand i{font-style:normal;color:var(--accent)}
.lede{text-align:center;color:var(--muted);margin:6px 0 24px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:10px;text-decoration:none;font:600 15px var(--sans);cursor:pointer;border:1px solid var(--line);background:none;color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.6;cursor:default}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;margin-bottom:12px}
input.code{font:600 22px ui-monospace,Menlo,monospace;letter-spacing:.4em;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:13.5px;margin:0 0 12px}.msg.err{color:var(--err)}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:0;margin-top:12px}
small{display:block;margin-top:20px;color:var(--muted);font-size:12.5px;text-align:center}
svg{width:18px;height:18px}
</style>
</head>
<body>
<div class="card">
  <a class="brand" href="/">repro<i>log</i></a>
  <p class="lede">Sign in or create your account.</p>

  <a class="btn" href="/auth/google" id="google" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h6a5.1 5.1 0 0 1-2.2 3.4v2.8h3.6c2-1.9 3.2-4.7 3.2-8.2z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.4-2.7l-3.6-2.8c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14c-.2-.7-.4-1.4-.4-2s.1-1.4.4-2V7.1H2A11 11 0 0 0 1 12c0 1.8.4 3.5 1.2 4.9L5.7 14z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.3 1.7l3.2-3.2A11 11 0 0 0 2 7.1L5.7 10C6.6 7.4 9.1 5.4 12 5.4z"/></svg>Continue with Google</a>
  <div class="or" id="or" hidden>or</div>

  <form id="f-email">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@company.com" required>
    <p class="msg err" id="e1" hidden></p>
    <button class="btn primary" type="submit" id="b1">Email me a sign-in code</button>
  </form>

  <form id="f-code" hidden>
    <p class="msg" id="sentto"></p>
    <label for="code">6-digit code</label>
    <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required>
    <p class="msg err" id="e2" hidden></p>
    <button class="btn primary" type="submit" id="b2">Sign in</button>
    <button class="link" type="button" id="back">Use a different email</button>
  </form>

  <a class="btn" href="/auth/dev" id="dev" hidden style="margin-top:12px">Local dev login</a>
  <small>No password needed. New here? Signing in creates your account.</small>
</div>
<script>
const $=s=>document.querySelector(s);
const post=(u,b)=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(async r=>({ok:r.ok,...await r.json()}));
const ERR={expired:"That sign-in link expired. Try again.",google:"Google sign-in failed. Try again.",unverified:"Your Google email isn't verified."};
const q=new URLSearchParams(location.search).get("error"); if(ERR[q]){$("#e1").textContent=ERR[q];$("#e1").hidden=false}
fetch("/auth/config").then(r=>r.json()).then(c=>{$("#google").hidden=$("#or").hidden=!c.google;$("#dev").hidden=!c.dev});
let email="";
$("#f-email").onsubmit=async e=>{e.preventDefault();email=$("#email").value.trim();$("#b1").disabled=true;$("#e1").hidden=true;
  const r=await post("/auth/email/start",{email});$("#b1").disabled=false;
  if(!r.ok){$("#e1").textContent=r.error;$("#e1").hidden=false;return}
  $("#sentto").textContent=`We sent a code to ${email}. It expires in 10 minutes.`;
  if(r.dev_code)$("#code").value=r.dev_code;
  $("#f-email").hidden=true;$("#f-code").hidden=false;$("#code").focus()};
$("#f-code").onsubmit=async e=>{e.preventDefault();$("#b2").disabled=true;$("#e2").hidden=true;
  const r=await post("/auth/email/verify",{email,code:$("#code").value});
  if(r.ok)return location.href="/app";
  $("#b2").disabled=false;$("#e2").textContent=r.error;$("#e2").hidden=false};
$("#back").onclick=()=>{$("#f-code").hidden=true;$("#f-email").hidden=false;$("#code").value=""};
</script>
</body>
</html>
