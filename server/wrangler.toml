name = "reprolog"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Pages are bundled as text so the hosted dashboard reuses the library's viewer.
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

[[d1_databases]]
binding = "DB"
database_name = "reprolog"
database_id = "f8ae861e-0daf-4963-8948-6291942a521c"

# Daily log cleanup at 03:00 UTC; uptime checks every minute.
[triggers]
crons = ["0 3 * * *", "* * * * *"]   # daily cleanup, uptime checks every minute

[vars]
RETENTION_DAYS = "7"
DAILY_CAPTURE_LIMIT = "1700"   # free plan: ~50k logs a month per user
MAX_PROJECTS = "3"

# Secrets (wrangler secret put ...; locally in .dev.vars):
#   SESSION_SECRET        random string used to sign login cookies
#   GOOGLE_CLIENT_ID      Google OAuth client ("Continue with Google")
#   GOOGLE_CLIENT_SECRET
#   SMTP_USER             Gmail address that sends sign-in codes
#   SMTP_PASS             its Google app password (needs 2-step verification)
#   DEV_LOGIN=1           local only: enables /auth/dev and shows email codes on screen
